[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hosting-scraper"
version = "0.1.0"
description = "Config-driven hosting pricing scraper seeded by Certbot's hosting providers registry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "autoscrap contributors" }]
keywords = ["scraping", "hosting", "pricing", "certbot", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
playwright = ["playwright>=1.44"]
postgres = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.1"]
socks = ["httpx[socks]>=0.27"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "SQLAlchemy>=2.0",
]

[project.scripts]
hosting-scraper = "hosting_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/aminavua/autoscrap"
Repository = "https://github.com/aminavua/autoscrap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hosting_scraper = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
